name: CI/CD

# Pushes to master deploy prod and pushes to qa deploy QA on the Oracle server.
on:
  push:
    branches: [master, qa]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (SQLite, 100% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tasker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Coverage is enforced by the SQLite job; some SQLite-only branches never run here.
      - run: pytest --no-cov
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/tasker_test

  frontend:
    name: Frontend tests (100% coverage) and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Oracle (${{ github.ref_name == 'master' && 'prod' || 'qa' }})
    needs: [backend, backend-postgres, frontend]
    if: github.event_name != 'pull_request' && (github.ref_name == 'master' || github.ref_name == 'qa')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'oracle-prod' || 'oracle-qa' }}
      url: ${{ vars.APP_URL }}
    env:
      TARGET: ${{ github.ref_name == 'master' && 'prod' || 'qa' }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_USER" ]; then
            echo "::warning::Oracle deploy skipped: set ORACLE_HOST, ORACLE_USER and ORACLE_SSH_KEY secrets (see deploy/oracle/README.md)."
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - name: Set up SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts; else ssh-keyscan -H "$ORACLE_HOST" >~/.ssh/known_hosts; fi
          printf 'Host oracle\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "$ORACLE_HOST" "$ORACLE_USER" >~/.ssh/config
      - name: Upload code
        if: steps.config.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .venv --exclude dist --exclude coverage --exclude '*.db' --exclude .amp \
            ./ "oracle:/opt/tasker/src/$TARGET/"
      - name: Build and start
        if: steps.config.outputs.ready == 'true'
        run: ssh oracle "bash /opt/tasker/src/$TARGET/deploy/oracle/deploy.sh $TARGET"
      - name: Smoke test
        if: steps.config.outputs.ready == 'true' && vars.APP_URL != ''
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.APP_URL }}/api/health"
