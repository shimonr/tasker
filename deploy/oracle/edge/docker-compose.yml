# Shared HTTPS reverse proxy (caddy-docker-proxy). It routes every container on the "web" network
# that has `caddy` labels and gets Let's Encrypt certificates automatically.
# deploy.sh starts it only when nothing else already serves ports 80/443 on the server.
name: proxy

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CADDY_INGRESS_NETWORKS: web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data
    networks: [web]

volumes:
  caddy-data:

networks:
  web:
    external: true
    name: web
