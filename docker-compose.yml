# Local production-like stack: http://localhost:8080
# For hot reload, run uvicorn and `npm run dev` directly instead (see README).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/tasker.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      APP_BASE_URL: http://localhost:8080
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - backend-data:/data
  web:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
